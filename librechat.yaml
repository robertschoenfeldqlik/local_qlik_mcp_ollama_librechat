version: 1.2.1
cache: true

endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1/"
      models:
        default:
          - "llama3.2"
          - "mistral"
          - "codellama"
          - "phi3"
          - "gemma2"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      forcePrompt: false
      modelDisplayLabel: "Ollama"

mcpServers:
  qlik:
    type: streamable-http
    url: "${QLIK_TENANT_URL}/api/ai/mcp"
    requiresOAuth: true
    oauth:
      authorization_url: "${QLIK_TENANT_URL}/oauth/authorize"
      token_url: "${QLIK_TENANT_URL}/oauth/token"
      client_id: "${QLIK_OAUTH_CLIENT_ID}"
      redirect_uri: "http://localhost:3080/api/mcp/qlik/oauth/callback"
      scope: "user_default mcp:execute"
      grant_types_supported: ["authorization_code", "refresh_token"]
      token_endpoint_auth_methods_supported: ["none"]
      response_types_supported: ["code"]
      code_challenge_methods_supported: ["S256"]
    chatMenu: true
    startup: true
