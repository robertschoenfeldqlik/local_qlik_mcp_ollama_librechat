version: 1.2.1
cache: true

endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://ollama:11434/v1/"
      models:
        default:
          - "llama3.2"
          - "mistral"
          - "codellama"
          - "phi3"
          - "gemma2"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      forcePrompt: false
      modelDisplayLabel: "Ollama"

mcpServers:
  qlik:
    type: streamable-http
    url: "${QLIK_TENANT_URL}/api/ai/mcp"
    headers:
      Authorization: "Bearer ${QLIK_API_KEY}"
    chatMenu: true
    startup: true
